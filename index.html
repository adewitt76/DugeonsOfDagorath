<!DOCTYPE html>
<html>
  <head>
    <title>Dungeons of Daggorath</title>
    <base href=".">
    <link rel="stylesheet" href="styles.css">
    <audio id="scroll" preload="auto">
      <source src="assets/0E_whoop.wav" type="audio/wav"></source> 
    </audio>
    <audio id="torch" preload="auto">
      <source src="assets/11_chuck.wav" type="audio/wav"></source> 
    </audio>
    <audio id="explosion_1" preload="auto">
      <source src="assets/16_kaboom.wav" type="audio/wav"></source> 
    </audio>
    <audio id="heart_1" preload="auto">
      <source src="assets/17_heart.wav" type="audio/wav"></source> 
    </audio>
    <audio id="heart_2" preload="auto">
      <source src="assets/18_heart.wav" type="audio/wav"></source> 
    </audio>
    <audio id="buzz" preload="auto">
      <source src="assets/19_buzz.wav" type="audio/wav"></source> 
    </audio>
  </head>
  <body>
    <dialog id="prepare-modal" class="modal-overlay">
      <div class="modal-content">
        <h2 class="modal-title">PREPARE!</h2>
        <p class="modal-text">The dungeons await thee, brave adventurer.<br>Click to enter the realm of Daggorath...</p>
        <button id="prepare-btn" class="prepare-button">ENTER THE DUNGEONS</button>
      </div>
    </dialog>
    
    <div class="game-container">
      <h1 class="title">DUNGEONS OF<br>DAGGORATH</h1>
      <div class="canvas-frame">
        <canvas id="canvas_1" width="256" height="192"></canvas>
        <canvas id="canvas_2" width="256" height="192"></canvas>
      </div>
      <div class="subtitle">Enter if ye dare...</div>
    </div>
    <script type="module" src="script.js"></script>
    <div id="debug-overlay"></div>
  </body>
</html>
